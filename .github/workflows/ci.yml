name: IDEAS CI

concurrency:
  group: ideas-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/ideas-v2-foundation]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: idea-app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: idea-app/backend/requirements.txt
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - run: pytest -q

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: idea-app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter analyze --no-fatal-infos
      - run: flutter build apk --debug
      - name: Build Flutter Web CI artifact
        run: flutter build web --release --dart-define=API_BASE_URL=http://127.0.0.1:8765/api
      - name: Upload Flutter Web CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ideas-v2-web-ci
          path: idea-app/frontend/build/web/
          retention-days: 14

  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ideas_migration_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ideas_migration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: idea-app/backend
    env:
      IDEAS_MIGRATION_TEST_DSN: postgresql://postgres:postgres@localhost:5432/ideas_migration_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: idea-app/backend/requirements.txt
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - run: pytest -q tests/test_postgres_migrations.py

  postgres-version-concurrency:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ideas_version_concurrency_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ideas_version_concurrency_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: idea-app/backend
    env:
      IDEAS_VERSION_CONCURRENCY_TEST_DSN: postgresql://postgres:postgres@localhost:5432/ideas_version_concurrency_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: idea-app/backend/requirements.txt
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - run: pytest -q tests/test_postgres_version_concurrency.py tests/test_postgres_collaboration_concurrency.py tests/test_postgres_reports_concurrency.py

  postgres-universe-performance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ideas_universe_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ideas_universe_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: idea-app/backend
    env:
      IDEAS_UNIVERSE_TEST_DSN: postgresql://postgres:postgres@localhost:5432/ideas_universe_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: idea-app/backend/requirements.txt
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - run: pytest -q tests/test_postgres_universe_performance.py
