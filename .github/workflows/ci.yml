name: IDEAS CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/ideas-v2-foundation]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: idea-app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: idea-app/backend/requirements.txt
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - run: pytest -q

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: idea-app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter analyze
      - run: flutter build apk --debug
