name: IDEAS V2 Release Candidate

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Production API base URL, including /api"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: idea-app/frontend
        run: flutter pub get

      - name: Run Flutter tests and analysis
        working-directory: idea-app/frontend
        run: |
          flutter test
          flutter analyze --no-fatal-infos

      - name: Validate Android release signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub secret: $name"
              exit 1
            fi
          done

      - name: Configure Android upload keystore
        working-directory: idea-app/frontend/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/upload-keystore.jks
          cat > key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=app/upload-keystore.jks
          EOF

      - name: Build signed Android App Bundle
        working-directory: idea-app/frontend
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: flutter build appbundle --release --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Build production Flutter Web
        working-directory: idea-app/frontend
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: flutter build web --release --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Upload release candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ideas-v2-release-candidate
          path: |
            idea-app/frontend/build/app/outputs/bundle/release/app-release.aab
            idea-app/frontend/build/web/
          if-no-files-found: error
          retention-days: 14
