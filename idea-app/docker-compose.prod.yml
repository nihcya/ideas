# ============================================================
# 电子点子 App 生产部署编排
# 服务器：<your_server_ip> (Ubuntu 22.04, 2C/3.3G/48G)
# 模式：Docker 隔离部署 + Nginx 反代到 80 端口（IP 访问）
# ============================================================
# 关键设计：
#   1. PG/Redis/Backend 只绑 127.0.0.1，不对外暴露
#   2. 端口用非默认值（5433/6380/8765），避免与未来项目冲突
#   3. 容器内存限制，防止单容器 OOM 拖垮整机
#   4. PG/Redis 启动脚本自动建表建库，无需手动迁移
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: dianzi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dianzi
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: dianzi_app
    # PG 内存优化（小内存服务器必调）
    command: >
      postgres
      -c shared_buffers=128MB
      -c work_mem=4MB
      -c max_connections=80
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dianzi -d dianzi_app"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 384M

  redis:
    image: redis:7-alpine
    container_name: dianzi-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 48mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 64M

  backend:
    build: ./backend
    container_name: dianzi-backend
    restart: unless-stopped
    env_file: ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8765:8000"
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  postgres_data:
  redis_data:
