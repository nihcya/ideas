# ============================================================
# 电子点子 App Nginx 配置（IP 访问版）
# 服务器：124.221.108.59
# 模式：HTTP 80 端口反代到后端 127.0.0.1:8765
# 说明：暂无域名，未配 HTTPS；后续有域名后用 certbot --nginx 一键升级
# ============================================================
# 部署位置：
#   /opt/dianzi/nginx/dianzi.conf
#   软链到 /etc/nginx/sites-enabled/dianzi.conf
# ============================================================

# 后端 API + 前端 Web 同站部署（IP 根路径访问）
server {
    listen 80;
    listen [::]:80;
    server_name _;                     # 匹配所有 host（IP 访问）

    # ===== 健康检查不记日志 =====
    location /health {
        proxy_pass http://127.0.0.1:8765;
        access_log off;
    }

    # ===== API 接口 =====
    location /api/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # AI 演化接口可能较慢，超时设大一点
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 10M;
    }

    # ===== Swagger 文档（生产可考虑关闭）=====
    location /docs {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /openapi.json {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
    }
    location /redoc {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
    }

    # ===== 前端 Web 版（如部署在 /opt/dianzi/frontend/web）=====
    location / {
        root /opt/dianzi/frontend/web;
        index index.html;
        try_files $uri $uri/ /index.html;

        # 静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ===== 访问日志 =====
    access_log /var/log/nginx/dianzi_access.log;
    error_log /var/log/nginx/dianzi_error.log;
}
